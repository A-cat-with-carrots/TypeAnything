<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TypeAnything</title>
<link rel="icon" type="image/png" href="fish.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ─── Frameless titlebar (we strip WS_CAPTION; HTML owns the top edge) ─ -->
<header class="titlebar">
  <div class="title">
    <span class="logo" aria-hidden="true"></span>
    <span class="brand">神仙鱼<em>TypeAnything</em></span>
  </div>
  <label class="pure-toggle" id="pureToggleWrap" title="开启后只输出原始中文，Enter 正常换行/提交">
    <span class="pure-toggle-label">纯净模式</span>
    <input type="checkbox" id="pureToggle" />
    <span class="pure-toggle-slider" aria-hidden="true"></span>
  </label>
  <div class="window-controls" aria-hidden="false">
    <button class="wc wc-min"   id="wcMin"   type="button" aria-label="最小化">
      <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
    </button>
    <button class="wc wc-close" id="wcClose" type="button" aria-label="关闭">
      <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1 L9 9 M9 1 L1 9" stroke="currentColor" stroke-width="1" fill="none"/></svg>
    </button>
  </div>
</header>

<nav class="page-tabs">
  <button class="page-tab" data-page="lang">切换风格</button>
  <button class="page-tab" data-page="model">模型配置</button>
</nav>

<main>

  <!-- ───────────────────────── PAGE: LANGUAGE ───────────────────────── -->
  <section class="page" id="page-lang">
    <p class="eyebrow">SWITCH TARGET</p>
    <h1>你说什么<span class="accent">口吻</span>，AI 就给你什么口吻。</h1>

    <div class="input-wrap">
      <input id="langInput" type="text" placeholder="English" autofocus />
      <button id="langSave" class="btn primary">保存</button>
    </div>
    <p class="sub">输入任意自然语言描述，下次按 <code>Enter</code> 翻译时即按此风格落地。可以是语种、圈层、文体，甚至「像鲁迅一样的英语」。</p>

    <div class="category">
      <h3>语种</h3>
      <div class="chips" data-group="lang" data-category="A">
        <button class="chip">English</button>
        <button class="chip">日本語</button>
        <button class="chip">한국어</button>
        <button class="chip">Français</button>
        <button class="chip">Deutsch</button>
        <button class="chip">Español</button>
        <button class="chip">粵語</button>
      </div>
    </div>

    <div class="category">
      <h3>圈层风格</h3>
      <div class="chips" data-group="clique" data-category="B">
        <button class="chip">金融式说话</button>
        <button class="chip">留学生式说话</button>
        <button class="chip">互联网黑话</button>
        <button class="chip">学术大佬式</button>
        <button class="chip">HR 式说话</button>
        <button class="chip">销售式说话</button>
        <button class="chip">二次元</button>
        <button class="chip">东北话</button>
        <button class="chip">台湾腔</button>
        <button class="chip">老北京话</button>
      </div>
    </div>

    <div class="category">
      <h3>文体</h3>
      <div class="chips" data-group="medium" data-category="B">
        <button class="chip">古汉语风格</button>
        <button class="chip">知乎大佬腔</button>
        <button class="chip">鲁迅式中文</button>
        <button class="chip">小红书种草体</button>
        <button class="chip">营销号体</button>
        <button class="chip">武侠小说体</button>
        <button class="chip">玄幻爽文体</button>
        <button class="chip">古风小生</button>
        <button class="chip">玛丽苏文</button>
      </div>
    </div>

    <div class="category">
      <h3>人设话术</h3>
      <div class="chips" data-group="persona" data-category="B">
        <button class="chip">客服式</button>
        <button class="chip">法律文书</button>
        <button class="chip">公文体</button>
        <button class="chip">渣男话术</button>
        <button class="chip">舔狗式</button>
        <button class="chip">AI 助手腔</button>
      </div>
    </div>

    <div class="category">
      <h3>跨语种 / 编码</h3>
      <div class="chips" data-group="cross">
        <button class="chip" data-category="C">学术英语</button>
        <button class="chip" data-category="C">商务日语</button>
        <button class="chip" data-category="C">港片黑帮台词</button>
        <button class="chip" data-category="C">Klingon battle prose</button>
        <button class="chip" data-category="C">Cockney slang</button>
        <button class="chip" data-category="C">Indian English</button>
        <button class="chip" data-category="D">火星文</button>
        <button class="chip" data-category="D">拼音体</button>
      </div>
    </div>
  </section>

  <!-- ───────────────────────── PAGE: MODEL ─────────────────────────── -->
  <section class="page" id="page-model" hidden>
    <p class="eyebrow">PROVIDER · BYOK</p>
    <h1>接入你自己的<span class="accent">模型</span>。</h1>
    <p class="sub">你的输入只发到下面这个 endpoint。无中转、无后端代理。默认 DeepSeek，可换 OpenAI / Moonshot / 智谱 / 自托管 vLLM / Ollama 等任意 OpenAI Chat Completions 兼容 API。</p>

    <div class="preset-row">
      <button class="preset" data-preset="deepseek">DeepSeek</button>
      <button class="preset" data-preset="moonshot">Moonshot</button>
      <button class="preset" data-preset="openai">OpenAI</button>
      <button class="preset" data-preset="ollama">Ollama</button>
      <button class="preset" data-preset="custom">自定义</button>
    </div>

    <form id="modelForm" class="form-grid" onsubmit="return false;">
      <label class="full">
        <span>API Key</span>
        <div class="masked">
          <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
          <button type="button" class="toggle" id="toggleKey" title="显示 / 隐藏" aria-label="toggle">👁</button>
        </div>
      </label>

      <label class="full">
        <span>Model</span>
        <input id="model" type="text" placeholder="deepseek-chat" />
      </label>

      <label class="full">
        <span>Host</span>
        <input id="host" type="text" placeholder="api.deepseek.com" />
      </label>
      <label class="full">
        <span>Path</span>
        <input id="path" type="text" placeholder="/v1/chat/completions" />
      </label>

      <p class="endpoint-preview" id="endpointPreview"></p>
    </form>

    <div class="actions">
      <button class="btn" id="btnCancelModel">取消</button>
      <button class="btn primary" id="btnSaveModel">保存并应用</button>
    </div>
  </section>

</main>

<!-- toast -->
<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
