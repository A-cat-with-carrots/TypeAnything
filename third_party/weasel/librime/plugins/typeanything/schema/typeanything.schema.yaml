# TypeAnything — pinyin → simplified Chinese → on Enter, LLM translates
# Chinese to the active target language (chosen via tray "Switch Language" menu).

schema:
  schema_id: typeanything
  name: TypeAnything
  version: "0.3"
  author:
    - TypeAnything
  description: |
    Type Chinese pinyin, press Enter, get target-language translation.
    Switch target language via the tray icon's "Switch Language" menu.

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, ABC ]
  - name: simplification
    reset: 1
    states: [ 漢字, 汉字 ]

engine:
  processors:
    - typeanything_processor
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - script_translator
  filters:
    - simplifier@simplification_filter
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^xx$/
    - derive/^([jqxy])u$/$1v/
    - derive/^([aoe])(.*)$/o$1$2/
    - xform/^([aoe])(.*)$/$1$1$2/
    # 模糊音匹配：声母简写（zh→z / ch→c / sh→s）
    - derive/^([zcs])h/$1/
    # 首字母缩写：每个音节只输首字母，例如 xz→现在 / bjdx→北京大学
    - abbrev/^([a-z]).+$/$1/
    # 多字符前缀缩写：xian→x（声母）OR xian→xi（声母+介音）
    - abbrev/^([a-z]{2}).+$/$1/

translator:
  dictionary: luna_pinyin
  prism: typeanything
  # ----- User-dictionary learning -----
  # Rime accumulates per-user frequency on every commit. After a few hundred
  # commits the candidate order reflects the user's typing habits.
  enable_user_dict: true     # save commits to luna_pinyin.userdb
  enable_encoder: true       # encode multi-char compositions as new phrases
  enable_sentence: true      # compose whole sentence as a single candidate
  enable_completion: true    # surface abbrev / partial matches
  initial_quality: 1.2       # boost user_dict over base dict slightly
  preedit_format:
    - xform/([nljqxy])v/$1ü/

simplification_filter:
  option_name: simplification
  opencc_config: t2s.json

# Punctuation: direct single mapping. No candidate-popup ever. Mode-aware:
#   * ascii_mode=true → ASCII / half-width
#   * ascii_mode=false → 中文 全角 (symmetric quotes auto-paired)
# This matches Microsoft IME behaviour. Each key emits one candidate so no
# selection window appears.
punctuator:
  full_shape:
    " " : "　"
    "," : "，"
    "." : "。"
    ";" : "；"
    ":" : "："
    "?" : "？"
    "!" : "！"
    "\\" : "、"
    "/" : "／"
    "(" : "（"
    ")" : "）"
    "[" : "「"
    "]" : "」"
    "{" : "『"
    "}" : "』"
    "<" : "《"
    ">" : "》"
    "@" : "@"
    "#" : "#"
    "$" : "￥"
    "%" : "%"
    "^" : "……"
    "&" : "&"
    "*" : "×"
    "-" : "－"
    "_" : "——"
    "=" : "＝"
    "+" : "＋"
    "|" : "｜"
    "`" : "·"
    "~" : "～"
    "'" : { pair: [ "'", "'" ] }
    '"' : { pair: [ "“", "”" ] }
  half_shape:
    "," : ","
    "." : "."
    ";" : ";"
    ":" : ":"
    "?" : "?"
    "!" : "!"
    "\\" : "\\"
    "/" : "/"
    "(" : "("
    ")" : ")"
    "[" : "["
    "]" : "]"
    "{" : "{"
    "}" : "}"
    "<" : "<"
    ">" : ">"
    "@" : "@"
    "#" : "#"
    "$" : "$"
    "%" : "%"
    "^" : "^"
    "&" : "&"
    "*" : "*"
    "-" : "-"
    "_" : "_"
    "=" : "="
    "+" : "+"
    "|" : "|"
    "`" : "`"
    "~" : "~"
    "'" : "'"
    '"' : '"'

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

typeanything:
  api_key: ""
  model: deepseek-chat
  host: api.deepseek.com
  path: /v1/chat/completions
  target_lang: English   # fallback when typeanything_lang.txt absent
  temperature: 0.3
