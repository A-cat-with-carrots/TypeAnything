[project]
name = "typeeverything-ime"
version = "0.1.0"
description = "Pause-300ms Chinese-to-English IME via PIME + DeepSeek"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["typeeverything_ime"]
